<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#e9eef5" />
  <title>prism s-tile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette"></div>

  <div id="ui">
    <div id="hud" class="hidden">
      <div id="scoreBox">
        <div id="score">0</div>
        <div id="combo"></div>
        <div id="timing">
          <div id="timingMark"></div>
        </div>
      </div>
      <div id="flowTag">FLOW ×2</div>
      <div id="bpmTag">—</div>
      <div id="feedback"></div>
      <div id="tapHint">Tap to the beat</div>
    </div>

    <div id="menu" class="screen">
      <div class="brand">
        <h1>BEAT HOP</h1>
        <div class="eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="tagline">Drop in a song. It maps the kick, snare and hats — then builds a path that moves the way
          the track does.</p>
      </div>
      <div class="panel">
        <label class="btn primary" for="file">Choose a song</label>
        <input id="file" type="file"
          accept="audio/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.ogg,.oga,.caf" />
        <button class="btn ghost" id="demo">Play the demo</button>
        <div class="chips">
          <span class="chip">Headphones recommended</span>
          <span class="chip">MP3 · M4A · WAV</span>
        </div>
      </div>
    </div>

    <div id="loading" class="screen hidden">
      <div class="card">
        <h2 id="loadTitle" class="dots">Listening</h2>
        <div class="bar">
          <div id="barFill"></div>
        </div>
        <p class="sub" id="loadSub" style="margin-bottom:0">Reading the rhythm</p>
      </div>
    </div>

    <div id="results" class="screen hidden">
      <div class="card">
        <h2>Nice run</h2>
        <div class="bigScore" id="rScore">0</div>
        <div class="stats" id="rStats"></div>
        <button class="btn primary" id="again">Play again</button>
        <button class="btn ghost" id="back">New song</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
